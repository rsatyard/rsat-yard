# Every push to main builds the Android APK (published as a GitHub Release)
# and publishes the same app as the office website on GitHub Pages.
name: Build app and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Use fixed signing key if one is set up
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d --ignore-garbage > "$RUNNER_TEMP/release.p12"
            ALIAS=$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$STORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
            if [ -z "$ALIAS" ]; then echo "The signing key or its password is wrong. Check the two SIGNING_ secrets."; exit 1; fi
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$ALIAS"
              echo "SIGNING_KEY_PASSWORD=$STORE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the fixed key."
          else
            echo "No signing key set up: using a debug key (uninstall the old app before installing a new build)."
          fi

      - name: Stamp the build number into the app
        run: echo "window.APP_BUILD = ${{ github.run_number }};" > app/src/main/assets/www/version.js

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RSAT-Yard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RSAT Yard 1.0.${{ github.run_number }}
          body: Install RSAT-Yard.apk on Android phones (Android 8 or newer).
          files: RSAT-Yard.apk
          make_latest: true

  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www
      - id: deploy
        uses: actions/deploy-pages@v4
