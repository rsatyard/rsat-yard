plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rsat.yard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rsat.yard'
        minSdk 26
        targetSdk 34
        // CI passes the build number so each APK installs as an update.
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName = "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        // Optional fixed signing key (README, "Updating without uninstalling").
        // Without it the debug key is used, which changes on every cloud build.
        release {
            if (System.getenv('SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = System.getenv('SIGNING_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
